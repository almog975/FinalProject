# grafana/loki-stack — Loki + Promtail for Minikube (Phase 5)
# Grafana comes from kube-prometheus-stack; disable embedded Grafana/Prometheus here.

loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: false
  config:
    auth_enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

promtail:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  enabled: false

prometheus:
  enabled: false

fluent-bit:
  enabled: false
