apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop.fullname" . }}-secret
  labels:
    {{- include "shop.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  DATABASE_URL: {{ include "shop.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  {{- end }}
