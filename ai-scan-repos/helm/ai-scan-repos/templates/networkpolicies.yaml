{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ns := .Release.Namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: {{ $ns }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: {{ $ns }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend, namespace: {{ $ns }}}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}}}}]
      ports: [{port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway, namespace: {{ $ns }}}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
      ports: [{port: 8000}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}}}}]
      ports: [{port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app: review-api}}}]
      ports: [{port: 8000}]
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{port: 5432}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: {{ toJson $np.internetExcept }}}}]   # GitHub OAuth/API
      ports: [{port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: review-api, namespace: {{ $ns }}}
spec:
  podSelector: {matchLabels: {app: review-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: scanner-worker}}
      ports: [{port: 8000}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}}}}]
      ports: [{port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{port: 5432}]
    - to:
      {{- range $np.apiServer.cidrs }}
        - ipBlock: {cidr: {{ . }}}
      {{- end }}
      ports:
      {{- range $np.apiServer.ports }}
        - {port: {{ . }}}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres, namespace: {{ $ns }}}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {ai-scan-repos/db-client: "true"}}}]
      ports: [{port: 5432}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: scanner-worker, namespace: {{ $ns }}}
spec:
  podSelector: {matchLabels: {app: scanner-worker}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{podSelector: {matchLabels: {app: review-api}}}]
      ports: [{port: 8000}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: {{ toJson $np.internetExcept }}}}]   # git clone (GitHub) + cloud AI + trivy DB
      ports: [{port: 443}]
    {{- with .Values.scannerWorker.aiEgress }}
    - to:
      {{- range .cidrs }}
        - ipBlock: {cidr: {{ . }}}
      {{- end }}
      ports:
      {{- range .ports }}
        - {port: {{ . }}}
      {{- end }}
    {{- end }}
{{- end }}
