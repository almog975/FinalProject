{{- $p := .Values.postgres }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ais.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ais.labels" . | nindent 4 }}
    app: postgres
  annotations:
    checkov.io/skip1: CKV_K8S_40=official postgres image runs as UID 70 (alpine); data dir ownership depends on it
    checkov.io/skip2: CKV_K8S_43=postgres pinned by tag (16-alpine) for readability; mirror+digest in private registry later
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext: {{- include "ais.podSecurity" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ $p.image }}
          imagePullPolicy: Always
          securityContext: {{- include "ais.containerSecurity" (dict "uid" 70) | nindent 12 }}
          env:
            - {name: POSTGRES_DB, value: {{ $p.database | quote }}}
            - {name: POSTGRES_USER, value: {{ $p.user | quote }}}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres/POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U {{ $p.user }} -d {{ $p.database }}"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U {{ $p.user }} -d {{ $p.database }}"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: pg-secret, mountPath: /run/secrets/postgres, readOnly: true}
      volumes:
        - name: pg-secret
          secret: {secretName: {{ .Values.secrets.postgres }}, defaultMode: 0400}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $p.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $p.storage }}}}
