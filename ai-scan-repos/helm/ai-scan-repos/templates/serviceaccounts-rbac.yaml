{{- $ns := .Release.Namespace }}
{{- range $sa := list "frontend" "gateway" "postgres" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels: {{- include "ais.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-api
  namespace: {{ $ns }}
  labels: {{- include "ais.labels" . | nindent 4 }}
automountServiceAccountToken: false   # mounted explicitly only in the review-api pod
---
# Scanner Jobs: no API access at all. imagePullSecrets here so Jobs created by review-api can pull.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner-worker
  namespace: {{ $ns }}
  labels: {{- include "ais.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: review-api-job-launcher
  namespace: {{ $ns }}
  labels: {{- include "ais.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  # per-review AI key Secrets (created per Job, deleted on completion)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: review-api-job-launcher
  namespace: {{ $ns }}
  labels: {{- include "ais.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: review-api-job-launcher
subjects:
  - kind: ServiceAccount
    name: review-api
    namespace: {{ $ns }}
