# Template only (suspend: true). review-api clones this per review with --review-id.
apiVersion: batch/v1
kind: Job
metadata:
  name: scanner-worker-template
  labels: {app.kubernetes.io/name: scanner-worker}
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: scanner-worker}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8002", prometheus.io/path: /metrics}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scanner-worker
          image: ai-scan-repos/scanner-worker:dev
          args: ["--review-id", "PLACEHOLDER"]
          ports: [{name: http, containerPort: 8002}]
          env:
            - {name: REVIEW_API_URL, value: "http://review-api:8001"}
            - {name: HEALTH_PORT, value: "8002"}
            - name: INTERNAL_API_TOKEN
              valueFrom: {secretKeyRef: {name: ai-scan-secrets, key: INTERNAL_API_TOKEN}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: work, mountPath: /work}]
      volumes: [{name: work, emptyDir: {sizeLimit: 2Gi}}]
