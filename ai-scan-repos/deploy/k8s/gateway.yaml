apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: gateway}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: ai-scan-repos/gateway:dev
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: REVIEW_API_URL, value: "http://review-api:8001"}
            - {name: DATABASE_URL, value: "postgresql+psycopg://aiscan@postgres:5432/aiscan"}
          envFrom: [{secretRef: {name: ai-scan-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 8000, targetPort: http}]
