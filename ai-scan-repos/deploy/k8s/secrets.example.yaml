# PLACEHOLDER ONLY – no real secrets. Create the real Secret out-of-band, e.g.:
#   kubectl -n ai-scan create secret generic ai-scan-secrets --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=INTERNAL_API_TOKEN=... --from-literal=AI_KEYS_ENCRYPTION_KEY=... \
#     --from-literal=GITHUB_CLIENT_SECRET=... --from-literal=GITHUB_WEBHOOK_SECRET=... --from-literal=SESSION_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: ai-scan-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  INTERNAL_API_TOKEN: CHANGE_ME
  GITHUB_CLIENT_SECRET: CHANGE_ME
  GITHUB_WEBHOOK_SECRET: CHANGE_ME
  SESSION_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-keys-master
type: Opaque
stringData:
  AI_KEYS_ENCRYPTION_KEY: CHANGE_ME   # Fernet key; generate out-of-band
---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-secrets
type: Opaque
stringData:
  INTERNAL_API_TOKEN: CHANGE_ME
