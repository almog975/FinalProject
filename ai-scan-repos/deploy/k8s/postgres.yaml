apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres}
spec:
  clusterIP: None   # headless, for the StatefulSet
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: aiscan}
            - {name: POSTGRES_USER, value: aiscan}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ai-scan-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {exec: {command: [pg_isready, -U, aiscan, -d, aiscan]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [pg_isready, -U, aiscan, -d, aiscan]}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
