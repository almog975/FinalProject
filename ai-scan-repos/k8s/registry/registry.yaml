# Private Docker registry (distribution v2) with htpasswd auth.
# The auth secret "registry-htpasswd" is created from the CLI only (scripts/create-secrets.sh).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: registry, namespace: registry}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: {app: registry}
  annotations:
    checkov.io/skip1: CKV_K8S_43=registry:2.8.3 tag pinned; digest pinning is done by the operator per release
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata:
      labels: {app: registry}
    spec:
      serviceAccountName: registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: "AI Scan Registry"}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 10}
          readinessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
        - name: auth
          secret: {secretName: registry-htpasswd, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry, labels: {app: registry}}
spec:
  type: NodePort   # nodes (containerd) pull via localhost:30500; pods/Kaniko use registry.registry.svc.cluster.local:5000
  selector: {app: registry}
  ports: [{name: http, port: 5000, targetPort: http, nodePort: 30500}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: registry, namespace: registry}
spec:
  podSelector: {matchLabels: {app: registry}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 5000, protocol: TCP}]   # nodes (NodePort), Kaniko in jenkins, pods
  egress: []                                 # registry needs no outbound traffic
